name: Run release-please

on:
  workflow_dispatch:
    inputs:
      component-name:
        description: Component name (workflow name without .yml extension, or action name).
        required: true
        type: string
      component-type:
        description: Type of component to release.
        required: true
        type: choice
        default: action
        options:
          - workflow
          - action
      config-json-path:
        description: Path to the release-please config JSON file (relative to repo root).
        required: true
        default: .github/release-please/actions-config.json
        type: string
      manifest-json-path:
        description: Path to the release-please manifest JSON file (relative to repo root).
        required: true
        default: .github/release-please/actions-manifest.json
        type: string
      mode:
        description: Release Please mode.
        required: true
        type: choice
        options:
          - pr
          - release

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-workflow-config:
    if: inputs.component-type == 'workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check workflow config is up to date
        run: |
          .github/release-please-script/check-workflow-config-uptodate.sh \
            --workflow "${{ inputs.component-name }}"

  action-release-pr:
    if: inputs.component-type == 'action' && inputs.mode == 'pr'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 #v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: ${{ inputs.config-json-path }}
          manifest-file: ${{ inputs.manifest-json-path }}

  action-github-release:
    if: inputs.component-type == 'action' && inputs.mode == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 #v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: ${{ inputs.config-json-path }}
          manifest-file: ${{ inputs.manifest-json-path }}

  workflow-release-pr:
    needs: check-workflow-config
    if: inputs.component-type == 'workflow' && inputs.mode == 'pr'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 #v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: ${{ inputs.config-json-path }}
          manifest-file: ${{ inputs.manifest-json-path }}

  workflow-github-release:
    needs: check-workflow-config
    if: inputs.component-type == 'workflow' && inputs.mode == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: ${{ inputs.config-json-path }}
          manifest-file: ${{ inputs.manifest-json-path }}
