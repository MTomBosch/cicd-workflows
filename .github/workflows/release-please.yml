name: release-please

on:
  workflow_dispatch:
    inputs:
      component-name:
        description: Component name (workflow name without .yml extension, or action name).
        required: true
        type: string
      config-json-path:
        description: Path to the release-please config JSON file (relative to repo root).
        required: true
        default: .github/release-please/actions-config.json
        type: string
      manifest-json-path:
        description: Path to the release-please manifest JSON file (relative to repo root).
        required: true
        default: .github/release-please/actions-manifest.json
        type: string
      mode:
        description: Release Please mode.
        required: true
        type: choice
        options:
          - pr
          - release
      dry-run:
        description: Run Release Please in dry-run mode without creating PRs or releases.
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-workflow-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check workflow config is up to date
        run: |
          .github/release-please-script/check-workflow-config-uptodate.sh \
            --workflow "${{ inputs.component-name }}"

  release-pr:
    needs: check-workflow-config
    if: inputs.mode == 'pr'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: ${{ inputs.config-json-path }}
          manifest-file: ${{ inputs.manifest-json-path }}
          dry-run: ${{ inputs.dry-run }}

  github-release:
    needs: check-workflow-config
    if: inputs.mode == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: ${{ inputs.config-json-path }}
          manifest-file: ${{ inputs.manifest-json-path }}
          dry-run: ${{ inputs.dry-run }}
